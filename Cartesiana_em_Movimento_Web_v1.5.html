function robotOrderOk(c,trail){

}
function answer(actual){if(S.ended!==null)return;const c=S.challenge,a=S.activity;let expected,ok;
 if(a==='path'){expected=c.points[S.path.length];ok=eq(expected.x,actual.x)&&eq(expected.y,actual.y)}
 if(a==='air'){expected=c.answer;ok=String(actual)===c.answer.id}
 if(a==='line'){expected=c.target;ok=eq(expected,actual)}
 if(a==='robot'){expected=c.target;actual={...S.robot};const orderOk=robotOrderOk(c,S.robotTrail);ok=eq(actual.x,expected.x)&&eq(actual.y,expected.y)&&S.moves===c.minimum&&orderOk}
 if(!ok){S.wrong=a==='air'?null:a==='robot'?(eq(S.robot.x,c.target.x)&&eq(S.robot.y,c.target.y)?null:{...S.robot}):a==='line'?actual:{...actual};S.errors++;feedback(`Tente novamente. ${errorExplanation(expected,actual)}${S.errors>=3?' Use “Preciso de uma dica” para receber orientação adicional.':''}`);return}
 S.errors=0;S.wrong=null;
 if(a==='path'){S.path.push({...actual});if(S.path.length<c.points.length){feedback(`Correto! Próximo ponto: ${pt(c.points[S.path.length])}.`)}else finish('Muito bem! Você construiu todo o caminho na ordem correta.')}
 else finish(a==='robot'?`Correto! O robô chegou em ${S.moves} passos, pelo menor percurso possível na malha, respeitando os movimentos permitidos${c.order?' e a ordem exigida':''}.`:'Correto! Você localizou a posição.');update()
}
function mark(){if(S.activity==='robot'){answer({...S.robot});return}if(S.activity==='air'){const hit=S.challenge.planes.find(p=>eq(p.x,S.cursor.x)&&eq(p.y,S.cursor.y));answer(hit?hit.id:'nenhuma');return}answer(S.activity==='line'?S.cursor.x:{...S.cursor})}
function move(dx,dy){if(S.ended!==null)return;const b=bounds(),step=S.activity==='line'?.25:S.activity==='robot'?1:S.level===3?.5:1;if(S.activity==='robot'){const nx=S.robot.x+dx,ny=S.robot.y+dy;if(nx<b.x0||nx>b.x1||ny<b.y0||ny>b.y1)return;S.robotUndo.push({robot:{...S.robot},moves:S.moves});S.robot={x:nx,y:ny};S.cursor={...S.robot};S.moves++;S.robotTrail.push({...S.robot})}else{S.cursor.x=clamp(Math.round((S.cursor.x+dx*step)/step)*step,b.x0,b.x1);S.cursor.y=S.activity==='line'?0:clamp(Math.round((S.cursor.y+dy*step)/step)*step,b.y0,b.y1)}announce();draw();progress();describeScene()}
function announce(){$('cursorText').textContent=S.activity==='robot'?`Robô: ${pt(S.robot)} · ${S.moves} passo(s)`:S.activity==='line'?`Cursor na posição ${fmt(S.cursor.x)}`:`Cursor: ${pt(S.cursor)}`}
function sessionInfo(){$('session').textContent=`Sessão: ${S.session.correct} desafio(s) concluído(s) · ${S.session.done} tentativa(s) finalizada(s). Sem armazenamento.`}
function progress(){$('progress').textContent=S.activity==='path'?`${S.path.length}/${S.challenge.points.length} pontos`:S.activity==='robot'?`Passos: ${S.moves} · mínimo: ${S.challenge.minimum}`:''}
function update(){const c=S.challenge;$('challengeText').textContent=c.prompt;$('undo').classList.toggle('hidden',S.activity!=='path'&&S.activity!=='robot');$('submit').textContent='Confirmar';$('submit').disabled=S.ended!==null;$('next').classList.toggle('hidden',S.ended===null);$('hint').disabled=S.ended!==null;announce();progress();draw();describeScene();sessionInfo();$('moveControls').querySelectorAll('[data-dir="up"],[data-dir="down"]').forEach(b=>b.classList.toggle('hidden',S.activity==='line'))}
function restart(){S.path=[];S.moves=0;S.errors=0;S.wrong=null;S.robotUndo=[];S.robot=S.challenge.start?{...S.challenge.start}:{x:0,y:0};S.robotTrail=[{...S.robot}];S.cursor={...S.robot};if(S.activity==='line')S.cursor={x:0,y:0};S.ended=null;feedback('Desafio reiniciado.');update()}
function fresh(){S.challenge=challenge();restart()}
function pointer(e){if(S.ended!==null)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left-canvas.clientLeft)*G.w/canvas.clientWidth,y=(e.clientY-r.top-canvas.clientTop)*G.h/canvas.clientHeight;const rawX=(x-G.origin.x)/G.size,rawY=(G.origin.y-y)/G.size;const step=S.activity==='line'?S.challenge.step:S.activity==='path'&&S.level===3?.5:1;const b=bounds(),px=clamp(Math.round(rawX/step)*step,b.x0,b.x1),py=clamp(Math.round(rawY/step)*step,b.y0,b.y1);
 if(S.activity==='robot'){return}
 if(S.activity==='line'){if(Math.abs(y-G.origin.y)>38)return;S.cursor={x:px,y:0}}
 else if(S.activity==='air'){const hit=S.challenge.planes.map(p=>({p,d:Math.hypot(x-G.xy(p).x,y-G.xy(p).y)})).sort((a,b)=>a.d-b.d)[0];if(hit&&hit.d<=Math.min(24,Math.max(14,G.size*.48)))S.cursor={x:hit.p.x,y:hit.p.y};else{feedback('Selecione um círculo de aeronave.');return}}
 else S.cursor={x:px,y:py};feedback('Posição selecionada. Confira e pressione Confirmar.');announce();draw();describeScene()}
$('hint').onclick=hint;$('new').onclick=fresh;$('restart').onclick=restart;$('submit').onclick=mark;$('next').onclick=fresh;
$('undo').onclick=()=>{if(S.ended!==null){feedback('Desafio concluído. Use Reiniciar para tentar novamente.');return}if(S.activity==='robot'&&S.robotUndo.length){const old=S.robotUndo.pop();S.robot=old.robot;S.cursor={...S.robot};S.moves=old.moves;S.robotTrail.pop();feedback('Último passo desfeito.')}else if(S.path.length){S.path.pop();feedback('Último ponto desfeito.')}else feedback('Nada para desfazer.');update()};
for(const id of ['grade','activity','level'])$(id).onchange=()=>{S.grade=Number($('grade').value);S.activity=$('activity').value;S.level=Number($('level').value);fresh()};
$('zoom').onchange=()=>{S.zoom=$('zoom').value;draw()};$('contrast').onchange=()=>{document.body.classList.toggle('contrast',$('contrast').value==='high');draw()};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d=b.dataset.dir;move(d==='right'?1:d==='left'?-1:0,d==='up'?1:d==='down'?-1:0)});
canvas.onkeydown=e=>{const d={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]};if(d[e.key]){e.preventDefault();move(...d[e.key])}else if(e.key==='Enter'||e.key===' '){e.preventDefault();mark()}};
canvas.addEventListener('pointerdown',pointer);
$('describe').onclick=()=>{const open=$('descriptionVisible').classList.toggle('hidden')===false;$('describe').setAttribute('aria-expanded',String(open));describeScene()};
function describeScene(){const c=S.challenge;if(!c)return;const text=S.activity==='air'?`Aeronaves: ${c.planes.map(p=>`${p.id} em ${pt(p)}`).join('; ')}. Cursor em ${pt(S.cursor)}.`:S.activity==='robot'?`Início ${pt(c.start)}; destino ${pt(c.target)}; robô em ${pt(S.robot)}; ${S.moves} passos.`:S.activity==='path'?`Desafio: ${c.prompt}. Pontos já confirmados: ${S.path.length?S.path.map(pt).join(', '):'nenhum'}. Cursor em ${pt(S.cursor)}.`:`Reta de ${fmt(bounds().x0)} a ${fmt(bounds().x1)}; marcações de ${fmt(c.step)}. Cursor em ${fmt(S.cursor.x)}.`;$('sceneDescription').textContent=text;if(!$('descriptionVisible').classList.contains('hidden'))$('descriptionVisible').textContent=text}
$('tilt').onclick=async()=>{if(S.tilt){S.tilt=false;S.tiltBase=null;$('tilt').textContent='Inclinação (opcional)';$('tiltStatus').textContent='Desligada';return}if(!('DeviceOrientationEvent'in window)){$('tiltStatus').textContent='Indisponível neste navegador; use as setas.';return}try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Permissão negada');S.tiltSample=null;S.tiltBase=null;S.tilt=true;$('tilt').textContent='Desativar inclinação';$('tiltStatus').textContent='Mantenha o aparelho imóvel para calibrar.'}catch(e){$('tiltStatus').textContent='Sem permissão: '+e.message+'. Use as setas.'}};
window.addEventListener('deviceorientation',e=>{if(!S.tilt||S.ended!==null||e.gamma==null||e.beta==null)return;const now=Date.now();if(!S.tiltBase){if(!S.tiltSample)S.tiltSample={x:e.gamma,y:e.beta,t:now};if(now-S.tiltSample.t<800)return;S.tiltBase={x:e.gamma,y:e.beta};$('tilt').textContent='Inclinação: ligada';$('tiltStatus').textContent='Calibrada. Incline para explorar e pressione Confirmar.';return}if(now-S.tiltLast<380)return;const x=e.gamma-S.tiltBase.x,y=e.beta-S.tiltBase.y,dx=Math.abs(x)>16?Math.sign(x):0,dy=Math.abs(y)>16?-Math.sign(y):0;if(dx||dy){S.tiltLast=now;if(S.activity==='robot'){return}move(dx,dy)}});
fresh();resizeObserver=new ResizeObserver(()=>draw());resizeObserver.observe(canvas);
</script></body></html>
